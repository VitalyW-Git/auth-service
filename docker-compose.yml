version: '3.7'

services:
    db:
      container_name: 001_postgres
      image: postgres:18
      restart: unless-stopped
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB}
      ports:
        - 5444:5432
      volumes:
        - ./base/postgres/data:/var/lib/postgresql
      networks:
        - backend

    redis:
      container_name: 001_redis
      image: redis:7.2
      restart: unless-stopped
      command: >
        redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --dir /data --dbfilename dump.rdb
        --user claude_ro on '#052dd2176307436e3d381440627f8b3005594779208e34af64e550fb8a7a4070' '~*' '&*'
        +@read +@keyspace +@connection -@dangerous -@write
        +info +dbsize '+memory|usage' '+client|info' '+latency|latest' '+slowlog|get'
      ports:
        - 6381:6379
      volumes:
        - ./base/redis/data:/data
      networks:
        - backend

networks:
  backend: